apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/instance: graphql-gateway
    app.kubernetes.io/name: graphql-gateway
    app.kubernetes.io/version: 1.0.0
  name: graphql-gateway
spec:
  internalTrafficPolicy: Cluster
  ports:
    - name: https
      port: 4000
      protocol: TCP
      appProtocol: https
      targetPort: https
    # geolocateIP and parseUserAgent only, without the token check, for
    # in-cluster callers (the Zitadel actions receiver). The HTTPRoute routes
    # port 4000, so this port is never public.
    - name: internal
      port: 4001
      protocol: TCP
      appProtocol: https
      targetPort: internal
    # Prometheus only. The HTTPRoute routes port 4000, so /metrics never
    # reaches a public listener.
    - name: metrics
      port: 9464
      protocol: TCP
      appProtocol: https
      targetPort: metrics
  selector:
    app.kubernetes.io/component: backend
    app.kubernetes.io/instance: graphql-gateway
    app.kubernetes.io/name: graphql-gateway
  sessionAffinity: None
  type: ClusterIP

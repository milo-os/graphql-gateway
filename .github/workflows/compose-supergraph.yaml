name: Compose supergraph

on:
  schedule:
    # Daily at 04:00 UTC, ahead of the working day.
    - cron: '0 4 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: compose-supergraph
  cancel-in-progress: false

jobs:
  compose:
    name: Snapshot the staging supergraph
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup datumctl
        uses: datum-cloud/setup-datumctl-action@v1
        with:
          version: v0.20.0
          auth-hostname: auth.staging.env.datum.net
          credentials: ${{ secrets.STAGING_DATUMCTL_CREDENTIALS }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compose snapshot
        env:
          SUPERGRAPH_SERVER: https://api.staging.env.datum.net
          # The committed SDL is shared by every environment, so transports
          # point at the in-cluster service rather than the staging ingress.
          SUPERGRAPH_ENDPOINT: https://milo-apiserver.datum-system.svc.cluster.local:6443{context.headers.x-resource-endpoint-prefix}
        run: |
          set -euo pipefail
          token="$(datumctl auth get-token --output=token)"
          # Keep the bearer token out of the process argument list and the log.
          echo "::add-mask::$token"
          DATUM_TOKEN="$token" bunx tsx scripts/compose-supergraph.ts \
            --server "$SUPERGRAPH_SERVER" \
            --endpoint "$SUPERGRAPH_ENDPOINT"

      # Pushes and pull requests authored with GITHUB_TOKEN do not trigger other
      # workflows, so the Tests workflow never runs on this PR. The files are
      # generated and the compose step above already validated the SDL.
      - name: Open or update the snapshot PR
        uses: peter-evans/create-pull-request@v8
        with:
          branch: compose-supergraph
          sign-commits: true
          add-paths: supergraph/
          title: 'chore(supergraph): refresh the composed SDL'
          commit-message: |
            chore(supergraph): refresh the composed SDL

            Regenerated by the compose-supergraph workflow from the staging
            OpenAPI discovery document.
          body: |
            The scheduled compose job found a difference between the committed
            supergraph and the staging OpenAPI specs.

            Review the SDL diff for API additions, removals, or a change in
            response shape before merging.

            This workflow reads staging with the repository secret
            `STAGING_DATUMCTL_CREDENTIALS`: credentials for a dedicated staging
            service account with no role bindings, which is enough to read the
            OpenAPI discovery documents.
